# Daily monitoring run (daily.py). Distinct from config.yaml and
# config_comprehensive.yaml, which drive the collect.py backfill.
#
# No API key here. daily.py reads YOUTUBE_API_KEY from the environment, which
# deploy/run_daily.sh sources from .env (mode 600). This file is committed;
# the key is not.
#
# quota.share_* are fractions of the day's *remaining* allowance at the moment
# the stage starts, so a stage that underspends leaves the rest to the ones
# after it.

database:
  # Production, as of the 2026-09-16 cutover. The workstation copy is
  # data/youtube_monitoring.replica.db and both entry points refuse to open it
  # without --i-know-this-is-a-replica.
  sqlite_path: /data/ytmon/youtube_monitoring.db

lock:
  # Must match the flock target in deploy/run_daily.sh and the crontab entry
  # for collect.py, or the daily run and a backfill will not contend.
  path: data/.ytmon.lock

api:
  max_retries: 3
  retry_delay: 2

quota:
  # Standard allowance is 10,000 units/day per Cloud project, resetting at
  # midnight US/Pacific. Budget below the real ceiling so ad-hoc queries do not
  # get locked out. Raise once the 1M increase is approved (LOGBOOK: request
  # submitted 2026-04-20).
  daily_budget: 9000

  # Whether a response the API served with a non-quota error (400, 403 other
  # than quotaExceeded/dailyLimitExceeded, 404) also costs budget. They are
  # always COUNTED in quota_ledger.error_calls; this decides whether they are
  # also charged.
  #
  # TRUE as of Pacific day 2026-09-23 (set 2026-09-22, before that day's run).
  # Settled against the Cloud console on the two days a figure exists for:
  #   09-16  console 6,666  vs errors-charged 6,606 (0.91%)  vs 200-only 6,394 (4.25%)
  #   09-22  console 6,348  vs errors-charged 6,348 (0.00%)  vs 200-only 6,264 (1.34%)
  # Both reject 200-only at over 1% and match errors-charged, so YouTube does
  # bill a response it served with a non-quota error. Flipping this back is a
  # LOGBOOK event and must record the Pacific day it takes effect, because the
  # day's budget arithmetic changes from that day on.
  charge_error_responses: true
  share_channels: 0.05      # channels.list: 50 channels per unit
  # Discovery needs ~1,590 units/day for the whole frame at the cadence below.
  # At 0.15 of a 10k day it would get ~1,490 and fall permanently behind, so
  # tier 0 would miss its 2-day cadence. 0.20 leaves headroom.
  share_discovery: 0.20     # uploads playlists: 1 unit per channel visit
  share_videos: 0.15        # videos.list: 50 videos per unit
  share_comments: 0.60      # commentThreads.list: 100 comments per unit

schedule:
  channel_refresh_days: 1       # re-snapshot subscriber/view counts this often

  # Per tier: how often to look for new uploads. playlistItems costs a hard
  # 1 unit per channel per visit, so a daily sweep of the whole frame is what
  # makes tier 0 alone exceed a 10k day. At this cadence the frame costs about
  # 1,590 units/day: 2,856/2 + 788/7 + 668/14.
  discovery_days:
    0: 2
    1: 7
    2: 14

  # Per tier: cadence + 1, so consecutive passes overlap and no upload falls
  # into the gap between them.
  upload_lookback_days:
    0: 3
    1: 8
    2: 15
  video_restat_days: 1          # re-snapshot video statistics this often
  video_tracking_days: 30       # keep re-snapshotting videos this young

  # Per tier: how long to keep re-polling a video's comments. Tier 0 is the
  # validated NewsGuard frame and gets the longest window.
  comment_tracking_days:
    0: 30
    1: 14
    2: 7

# Tiers this pipeline is allowed to spend quota on. Tier 2 was admitted after
# the rule-(a) tightening (Politics topic required for individuals, title_only
# outlets dropped): the redraw measured 8% false positives against a 15%
# threshold, 6.3% pooled over 63 hand-checked rows (LOGBOOK, 2026-09-16).
# Tier 3 is never collected whatever this says.
collect_tiers: [0, 1, 2]

limits:
  max_upload_pages_per_channel: 2    # 2 pages = up to 100 recent uploads
  stop_after_known_videos: 10        # stop paging once the tail is already stored
  max_reply_pages_per_comment: 2
  fetch_full_replies: true           # false = keep only inline replies per thread
  comment_order: time                # 'time' for a census; 'relevance' mirrors
                                     # what a viewer sees (not exhaustive)
  recomment_growth_ratio: 1.10       # re-poll when the count grew >10%

  # Per tier: comment pages per video, 100 comments per page. Tier 0 gets a
  # deep pull, tier 2 a shallow sample.
  # Tier 0 lowered 50 -> 10 (2026-09-18): at 50 pages a single busy video
  # could take 5,000 comments and a twentieth of the day's comment share,
  # while videos behind it expired unharvested. 10 pages caps one video at
  # 1,000 comments and spends the rest on breadth.
  max_comment_pages_per_video:
    0: 10
    1: 10
    2: 3

logging:
  level: INFO
  file: logs/pipeline.log
